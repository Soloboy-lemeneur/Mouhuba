<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Aperçu du lien : une petite surprise pour toi">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f9"/>
      <stop offset="45%" stop-color="#ffeaf1"/>
      <stop offset="100%" stop-color="#f1ebff"/>
    </linearGradient>
    <radialGradient id="halo" cx="20%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#ffdfc8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffdfc8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fond)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <g opacity="0.55" fill="#f89cba">
    <ellipse cx="118" cy="118" rx="34" ry="46" transform="rotate(0 118 118)"/>
    <ellipse cx="118" cy="118" rx="46" ry="34"/>
    <ellipse cx="86" cy="86" rx="32" ry="38" transform="rotate(-45 86 86)"/>
    <ellipse cx="150" cy="150" rx="32" ry="38" transform="rotate(-45 150 150)"/>
    <circle cx="118" cy="118" r="26" fill="#fff8ec"/>
  </g>
  <g opacity="0.5" fill="#b5a3f0">
    <ellipse cx="1078" cy="500" rx="26" ry="36"/>
    <ellipse cx="1078" cy="500" rx="36" ry="26"/>
    <circle cx="1078" cy="500" r="20" fill="#fff8ec"/>
  </g>

  <rect x="60" y="60" width="1080" height="510" rx="52" fill="#fffdfb" opacity="0.72"/>
  <rect x="60" y="60" width="1080" height="510" rx="52" fill="none" stroke="#ffffff" stroke-width="3"/>

  <text x="600" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="7" fill="#9a83dd">POUR TOI</text>
  <text x="600" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#a9436a">Une petite surprise</text>
  <text x="600" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" fill="#7d5f6d">quelques mots, quelques images, une attention</text>
</svg>
